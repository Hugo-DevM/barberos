<!doctype html>
<html lang="es-MX" data-formato="vertical">
  <head>
    <meta charset="utf-8" />
    <style>
      __FUENTE_CSS__

      :root {
        --fondo: __FONDO__;
        --texto: __TEXTO__;
        /* El resto de la paleta sale de esos dos: así el lienzo funciona con
           cualquier marca sin pedir seis colores. */
        --apagado: color-mix(in srgb, var(--texto) 62%, var(--fondo));
        --borde: color-mix(in srgb, var(--texto) 34%, transparent);
        --bisel: color-mix(in srgb, var(--fondo) 80%, #000);
        --hueco: color-mix(in srgb, var(--texto) 18%, transparent);
      }

      * { box-sizing: border-box; margin: 0; }
      html, body { width: 100%; height: 100%; }

      body {
        display: grid;
        place-items: center;
        background: var(--fondo);
        font-family: __FAMILIA__;
        color: var(--texto);
        overflow: hidden;
      }

      .lienzo {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 44px;
        padding: 64px 56px;
        text-align: center;
      }

      /* --- Zona segura ------------------------------------------------------
         Instagram recorta el feed a 4:5 aunque subas 3:4 (1080×1440), y la
         cuadrícula del perfil recorta a 3:4. Con `seguro` el contenido se
         encierra en una caja centrada de esa proporción: el recorte sólo se
         come fondo, nunca el titular ni los dispositivos. */

      html[data-seguro] .lienzo {
        aspect-ratio: var(--seguro);
        height: auto;
        max-width: 100%;
        max-height: 100%;
      }

      /* Con --guias se dibuja el borde de la zona segura para revisarla.
         No se usa al publicar. */
      html[data-guias] .lienzo {
        outline: 2px dashed color-mix(in srgb, var(--texto) 45%, transparent);
        outline-offset: -1px;
      }

      /* --- Texto ----------------------------------------------------------- */

      .cabecera { display: grid; justify-items: center; gap: 18px; }

      .insignia {
        display: inline-block;
        padding: 8px 16px;
        border: 1px solid var(--borde);
        border-radius: 2px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--apagado);
      }

      .insignia:empty { display: none; }

      .titular {
        font-size: 52px;
        font-weight: 600;
        line-height: 1.02;
        letter-spacing: -0.035em;
        text-transform: uppercase;
        max-width: 18ch;
        text-wrap: balance;
      }

      .pie {
        font-size: 19px;
        color: var(--apagado);
        max-width: 46ch;
        text-wrap: balance;
      }
      .pie:empty { display: none; }

      /* --- Escena de dispositivos ------------------------------------------- */

      .escena { position: relative; width: 100%; display: grid; place-items: center; }

      .laptop { width: 100%; max-width: 860px; }

      .laptop__bisel {
        padding: 12px;
        background: var(--bisel);
        border: 1px solid var(--hueco);
        border-radius: 14px 14px 4px 4px;
        box-shadow: 0 40px 90px -40px rgba(0, 0, 0, 0.85);
      }

      .laptop__pantalla {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: cover;
        object-position: top center;
        border-radius: 5px;
      }

      .laptop__base {
        width: 112%;
        margin-left: -6%;
        height: 15px;
        background: color-mix(in srgb, var(--fondo) 88%, var(--texto));
        border: 1px solid var(--hueco);
        border-top: 0;
        border-radius: 0 0 12px 12px;
      }

      .telefono {
        position: absolute;
        right: 0;
        bottom: -26px;
        width: 176px;
        padding: 9px;
        background: var(--bisel);
        border: 1px solid var(--borde);
        border-radius: 26px;
        box-shadow: 0 30px 60px -28px rgba(0, 0, 0, 0.9);
      }

      .telefono__pantalla {
        display: block;
        width: 100%;
        aspect-ratio: 390 / 720;
        object-fit: cover;
        object-position: top center;
        border-radius: 18px;
      }

      .telefono__auricular {
        position: absolute;
        top: 19px;
        left: 50%;
        transform: translateX(-50%);
        width: 46px;
        height: 4px;
        background: var(--borde);
        border-radius: 99px;
      }

      /* Sin captura de móvil el teléfono no se dibuja. */
      .sin-movil .telefono { display: none; }

      /* --- Formatos ---------------------------------------------------------- */

      html[data-formato='cuadrado'] .titular { font-size: 46px; }
      html[data-formato='cuadrado'] .laptop { max-width: 760px; }
      html[data-formato='cuadrado'] .lienzo { gap: 36px; padding: 52px; }

      html[data-formato='vertical-alto'] .titular { font-size: 58px; }
      html[data-formato='vertical-alto'] .lienzo { gap: 70px; padding: 90px 64px; }

      html[data-formato='horizontal'] .lienzo {
        grid-template-columns: 1fr 1.05fr;
        align-items: center;
        justify-items: start;
        text-align: left;
        gap: 40px;
        padding: 52px 56px;
      }
      html[data-formato='horizontal'] .cabecera { justify-items: start; }
      html[data-formato='horizontal'] .titular { font-size: 40px; max-width: 14ch; }
      html[data-formato='horizontal'] .pie { font-size: 16px; }
      html[data-formato='horizontal'] .laptop { max-width: 100%; }
      html[data-formato='horizontal'] .telefono { width: 128px; bottom: -18px; right: -14px; }
      html[data-formato='horizontal'] .telefono__auricular { top: 15px; width: 34px; }
    </style>
  </head>
  <body class="__CLASES__">
    <div class="lienzo">
      <div class="cabecera">
        <span class="insignia">__INSIGNIA__</span>
        <h1 class="titular">__TITULAR__</h1>
        <p class="pie">__PIE__</p>
      </div>

      <div class="escena">
        <div class="laptop">
          <div class="laptop__bisel">
            <img class="laptop__pantalla" src="__ESCRITORIO__" alt="" />
          </div>
          <div class="laptop__base"></div>
        </div>

        <div class="telefono">
          <img class="telefono__pantalla" src="__MOVIL__" alt="" />
          <span class="telefono__auricular"></span>
        </div>
      </div>
    </div>
  </body>
</html>
